name: Face Reality Skincare
description: >-
  Face Reality Skincare is a professional acne-treatment skincare brand whose
  online store, at facerealityskincare.com, is built on Shopify. Beyond the
  consumer storefront, the store publishes a full agent-commerce surface: a
  hosted Storefront MCP server (5 shop/cart tools), a Universal Commerce Protocol
  (UCP) merchant profile, a Shopify Customer Account API exposed via OpenID
  Connect / OAuth 2.0 discovery, and a published llms.txt / agents.md describing
  how AI shopping agents may browse, build carts, and hand off to a
  human-approved checkout. Surfaced as a portfolio company of Norwest Venture
  Partners and enriched into the API Evangelist network from its live public
  discovery documents.
